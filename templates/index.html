<!DOCTYPE html>
<html>
<head>
  <title>Multiplayer Chess</title>

  <!-- Chessboard.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard.min.js"></script>

  <!-- Chess.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.min.js"></script>
</head>

<body>
<h2>Multiplayer Chess</h2>

<button onclick="createGame()">Create Game</button>
<input id="gameId" placeholder="Game ID">
<button onclick="joinGame()">Join</button>
<button onclick="randomMove()">Random Move</button>

<div id="board" style="width: 400px"></div>

<script>
let board = null;
let game = new Chess();
let gameId = null;

async function createGame() {
  try {
    console.log("Creating game...");
    const res = await fetch("/create_game");
    console.log("HTTP status:", res.status);

    const text = await res.text(); // DEBUG: read raw response
    console.log("Raw response:", text);

    const data = JSON.parse(text);
    console.log("Parsed JSON:", data);

    gameId = data.game_id;
    document.getElementById("gameId").value = gameId;
    joinGame();

  } catch (err) {
    console.error("Create game failed:", err);
  }
}


async function joinGame() {
  gameId = document.getElementById("gameId").value;
  const res = await fetch(`/get_fen/${gameId}`);
  const data = await res.json();
  game.load(data.fen);
  board.position(data.fen);
}

function onDragStart(source, piece) {
  if (game.game_over()) return false;
  if ((game.turn() === 'w' && piece.startsWith('b')) ||
      (game.turn() === 'b' && piece.startsWith('w'))) {
    return false;
  }
}

async function onDrop(source, target) {
  const move = game.move({from: source, to: target, promotion: 'q'});
  if (move === null) return 'snapback';

  await fetch(`/move/${gameId}`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({move: source + target})
  });

  syncBoard();
}

async function syncBoard() {
  const res = await fetch(`/get_fen/${gameId}`);
  const data = await res.json();
  game.load(data.fen);
  board.position(data.fen);
}

async function randomMove() {
  await fetch(`/random/${gameId}`, {method: "POST"});
  syncBoard();
}

board = Chessboard('board', {
  draggable: true,
  position: 'start',
  onDragStart: onDragStart,
  onDrop: onDrop
});

// Poll for opponent moves every 2s
setInterval(syncBoard, 2000);
</script>
</body>
</html>
